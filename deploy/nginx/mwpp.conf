# Canonical host Nginx site for woppandmopp.com — PHASE 1
# Deploy to: /etc/nginx/sites-available/mwpp
#
# Architecture:
#   Flask HTML + Flask JSON (gallery, ministry, health, contact, …) → Gunicorn :8000
#   Selected NestJS mobile namespaces → Docker API :4000
#   /realtime → Docker WebSocket :4100
#
# Do NOT proxy all of /api/ — Flask still owns:
#   /api/v1/gallery, /api/v1/events, /api/v1/ministry, /api/v1/health,
#   /api/v1/contact, /api/v1/prayer-requests, /api/v1/sermons, /api/v1/leaders, /api/v1/courses
#
# Prerequisite: NestJS published on 127.0.0.1:4000 and WS on 127.0.0.1:4100.
# Host Nginx owns public :80/:443 (do not bind Docker Nginx to those ports).

upstream mwpp_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

upstream nest_api {
    server 127.0.0.1:4000 fail_timeout=0;
}

upstream nest_ws {
    server 127.0.0.1:4100 fail_timeout=0;
}

# Shared Nest API proxy settings (used via include in live HTTPS merges if preferred).
# For a single-file site config, locations below inline the same headers.

server {
    listen 80;
    listen [::]:80;
    server_name woppandmopp.com www.woppandmopp.com;

    client_max_body_size 100M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # -------------------------------------------------------------------------
    # PHASE 1 — NestJS mobile platform (MUST be before Flask catch-all)
    # -------------------------------------------------------------------------
    location ^~ /api/v1/auth/ {
        proxy_pass http://nest_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    location ^~ /api/v1/subscriptions/ {
        proxy_pass http://nest_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    location ^~ /api/v1/users/ {
        proxy_pass http://nest_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    location ^~ /api/v1/payments/ {
        proxy_pass http://nest_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    location ^~ /api/v1/notifications/ {
        proxy_pass http://nest_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    location ^~ /api/v1/announcements/ {
        proxy_pass http://nest_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    location ^~ /api/v1/clips/ {
        proxy_pass http://nest_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    location ^~ /api/v1/library {
        proxy_pass http://nest_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    location ^~ /api/v1/ebooks/ {
        proxy_pass http://nest_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # Nest mobile events only — do NOT match Flask GET /api/v1/events
    location ^~ /api/v1/events/public {
        proxy_pass http://nest_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    location ^~ /api/v1/events/me {
        proxy_pass http://nest_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    location /realtime {
        proxy_pass http://nest_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # -------------------------------------------------------------------------
    # Flask public website (HTML + remaining /api/v1/* JSON)
    # -------------------------------------------------------------------------
    location /static/ {
        alias /var/www/mwpp/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://mwpp_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}

# =============================================================================
# HTTPS — merge into the existing Certbot 443 server (keep SSL certificate lines).
# Copy the nest_api / nest_ws upstreams (if missing) and every PHASE 1 location
# block above into the listen 443 ssl server, BEFORE location /.
# =============================================================================
#
# upstream nest_api { server 127.0.0.1:4000 fail_timeout=0; }
# upstream nest_ws  { server 127.0.0.1:4100 fail_timeout=0; }
#
# Then paste the same location ^~ /api/v1/... and location /realtime blocks
# into the 443 server block, preserving:
#   ssl_certificate / etc.
#   client_max_body_size
#   location /static/
#   location /  → Flask
