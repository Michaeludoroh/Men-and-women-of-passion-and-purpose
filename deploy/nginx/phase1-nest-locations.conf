# Phase 1 snippet — include or paste into the LIVE Certbot HTTPS server block
# BEFORE location / and BEFORE any blanket location /api/.
#
# On the VPS:
#   1. sudo cp /etc/nginx/sites-available/mwpp /etc/nginx/sites-available/mwpp.bak.$(date +%Y%m%d%H%M)
#   2. Ensure these upstreams exist once at http{} or server-file top level:
#        upstream nest_api { server 127.0.0.1:4000 fail_timeout=0; }
#        upstream nest_ws  { server 127.0.0.1:4100 fail_timeout=0; }
#   3. Paste the locations below into the listen 443 ssl server for woppandmopp.com
#   4. sudo nginx -t && sudo systemctl reload nginx

location ^~ /api/v1/auth/ {
    proxy_pass http://nest_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    proxy_redirect off;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
}

